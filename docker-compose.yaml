services:

  api:
    build:
      context: .
      dockerfile: Dockerfile

    image: rag-assistant:latest

    user: "10001:10001"
    init: true
    read_only: true

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    pids_limit: 512

    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m

    command:
      - python
      - -m
      - uvicorn
      - app.api.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"

    ports:
      - "8000:8000"

    volumes:
      - ./storage/faiss_index:/app/storage/faiss_index:ro
      - huggingface_cache:/home/appuser/.cache/huggingface

    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RAG_API_KEY: ${RAG_API_KEY:-}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-localhost,127.0.0.1,api,testserver}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      ENABLE_DOCS: ${ENABLE_DOCS:-true}

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s

    restart: unless-stopped


  ui:
    image: rag-assistant:latest

    user: "10001:10001"
    init: true
    read_only: true

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    pids_limit: 256

    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m

    command:
      - python
      - -m
      - streamlit
      - run
      - app/ui/streamlit_app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true

    environment:
      HOME: /tmp
      RAG_API_BASE_URL: http://api:8000
      RAG_API_KEY: ${RAG_API_KEY:-}
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"

    ports:
      - "8501:8501"

    depends_on:
      api:
        condition: service_healthy

    restart: unless-stopped


  ingest:
    profiles:
      - tools

    build:
      context: .
      dockerfile: Dockerfile

    image: rag-assistant:latest

    user: "10001:10001"
    init: true
    read_only: true

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    pids_limit: 512

    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m

    command:
      - python
      - -m
      - app.ingestion.ingest

    volumes:
      - ./storage/faiss_index:/app/storage/faiss_index
      - huggingface_cache:/home/appuser/.cache/huggingface

    environment:
      TOKENIZERS_PARALLELISM: "false"


volumes:
  huggingface_cache:
