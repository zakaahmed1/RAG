name: RAG CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:


permissions:
  contents: read


jobs:

  # -------------------------------------------------------
  # Fast Python test suite
  # -------------------------------------------------------

  test:
    name: Python Tests

    runs-on: ubuntu-latest

    timeout-minutes: 20

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      TOKENIZERS_PARALLELISM: "false"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Check installed dependencies
        run: |
          python -m pip check

      - name: Run fast test suite with coverage
        run: |
          python -m pytest -m "not integration" \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error


  # -------------------------------------------------------
  # Docker validation
  # -------------------------------------------------------

  docker:
    name: Docker Build

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: |
          docker compose config

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: rag-assistant:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify non-root runtime identity
        run: |
          docker run --rm \
            --entrypoint python \
            rag-assistant:ci \
            -c "import os; assert os.geteuid() == 10001"

      - name: Run fast tests inside image
        run: |
          docker run --rm \
            rag-assistant:ci \
            python -m pytest -m "not integration" -q

  # -------------------------------------------------------
  # Security scanning
  # -------------------------------------------------------

  security:
    name: Security Scan

    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit bandit

      - name: Audit Python dependencies
        run: |
          pip-audit -r requirements.txt

      - name: Run static security analysis
        run: |
          bandit -r app -ll
