name: RAG Real-Stack Integration

on:
  workflow_dispatch:


permissions:
  contents: read


concurrency:
  group: rag-real-stack-integration
  cancel-in-progress: false


jobs:

  real-stack:
    name: FAISS and Model Runtime

    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      APP_ENV: production
      RAG_API_KEY: ci-integration-key-not-secret
      TRUSTED_HOSTS: localhost,127.0.0.1,api,testserver
      ENABLE_DOCS: "false"
      TOKENIZERS_PARALLELISM: "false"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build hardened image
        run: |
          docker compose build

      - name: Prepare index directory
        run: |
          mkdir -p storage/faiss_index
          sudo chown -R 10001:10001 storage/faiss_index

      - name: Build FAISS index in hardened image
        run: |
          docker compose --profile tools run --rm ingest

      - name: Start real API and UI stack
        run: |
          docker compose up -d

      - name: Wait for API health
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 10
          done
          docker compose logs api
          exit 1

      - name: Verify hardened runtime
        run: |
          docker compose exec -T api python -c \
            "import os; assert os.geteuid() == 10001"
          docker compose exec -T api python - <<'PY'
          from pathlib import Path

          try:
              Path("/app/root-write-test").write_text(
                  "blocked",
                  encoding="utf-8",
              )
          except OSError:
              pass
          else:
              raise AssertionError(
                  "Container root filesystem is writable."
              )
          PY

      - name: Exercise authenticated RAG query
        run: |
          python - <<'PY'
          import json
          import urllib.request

          request = urllib.request.Request(
              "http://127.0.0.1:8000/query",
              data=json.dumps(
                  {
                      "question": (
                          "How many days of annual leave "
                          "do full-time employees receive?"
                      )
                  }
              ).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "X-API-Key": "ci-integration-key-not-secret",
              },
              method="POST",
          )

          with urllib.request.urlopen(
              request,
              timeout=180,
          ) as response:
              assert response.status == 200
              payload = json.load(response)

          assert payload["retrieval_rejected"] is False
          assert payload["retrieved_count"] > 0
          assert payload["sources"]
          assert payload["answer"].strip()
          PY

      - name: Verify Streamlit health
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent \
              http://127.0.0.1:8501/_stcore/health; then
              exit 0
            fi
            sleep 5
          done
          docker compose logs ui
          exit 1

      - name: Show service status
        if: always()
        run: |
          docker compose ps

      - name: Show container logs on failure
        if: failure()
        run: |
          docker compose logs

      - name: Stop stack
        if: always()
        run: |
          docker compose down
